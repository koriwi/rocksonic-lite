name: Build and release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: rocksonic-lite-linux-x86_64
            archive: rocksonic-lite-linux-x86_64.tar.gz
          - name: macOS Intel
            os: macos-26-intel
            target: x86_64-apple-darwin
            artifact: rocksonic-lite-macos-x86_64
            archive: rocksonic-lite-macos-x86_64.tar.gz
          - name: macOS Apple silicon
            os: macos-26
            target: aarch64-apple-darwin
            artifact: rocksonic-lite-macos-aarch64
            archive: rocksonic-lite-macos-aarch64.tar.gz
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: rocksonic-lite-windows-x86_64
            archive: rocksonic-lite-windows-x86_64.zip

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Test
        run: cargo test --locked --release --target ${{ matrix.target }}

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          tar -C target/${{ matrix.target }}/release -czf dist/${{ matrix.archive }} rocksonic-lite

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist
          Compress-Archive `
            -Path target/${{ matrix.target }}/release/rocksonic-lite.exe `
            -DestinationPath dist/${{ matrix.archive }}

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Create release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download builds
        uses: actions/download-artifact@v4
        with:
          pattern: rocksonic-lite-*
          path: release
          merge-multiple: true

      - name: Create checksums
        working-directory: release
        run: sha256sum rocksonic-lite-* > SHA256SUMS

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
