[package]
default-run = "rocksonic-lite"
name = "rocksonic-lite"
version = "0.3.1"
edition = "2024"

[features]
default = []
gui = ["dep:eframe", "dep:rfd"]


[[bin]]
name = "rocksonic-lite-gui"
path = "src/bin/rocksonic-lite-gui.rs"

required-features = ["gui"]
[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
eframe = { version = "0.36.1", optional = true, default-features = false, features = [
  "default_fonts",
  "glow",
  "x11",
  "wayland",
] }
id3 = { version = "1.17.1", default-features = false }
image = { version = "0.25.10", features = ["jpeg"], default-features = false }
lofty = "0.25.1"
m3u = "1.0.0"
rayon = "1.12.0"
reqwest = { version = "0.13.4", features = ["blocking"] }
rfd = { version = "0.17.2", optional = true }
sanitize-filename = "0.6.0"
serde = { version = "1.0.229", features = ["derive"] }
serde-xml-rs = "0.8.2"
walkdir = "2.5.0"
yaml_serde = "0.10.7"
zune-jpeg = "0.5.15"
